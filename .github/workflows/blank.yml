
name: Build SkipMission ASI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Compile DLL
        run: cl /LD /O2 /EHsc SkipMission.cpp /Fe:SkipMission.asi

      - name: Upload ASI
        uses: actions/upload-artifact@v4
        with:
          name: SkipMission
          path: SkipMission.asi
